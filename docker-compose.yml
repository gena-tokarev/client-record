version: '3.9'

services:
  web:
    build:
      context: ./app
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
  core:
    build:
      context: ./app
      dockerfile: apps/core/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      BIND_HOST: ${BIND_HOST}
    depends_on:
      - db
  auth:
    build:
      context: ./app
      dockerfile: apps/auth/Dockerfile
  api-gateway:
    build:
      context: ./app
      dockerfile: apps/api-gateway/Dockerfile
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    expose:
      - ${DB_PORT}
    volumes:
      - ./db/postgresql.conf:/etc/postgresql/custom-postgresql.conf
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/custom-postgresql.conf
